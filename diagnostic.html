<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>みち — diagnostic d'installation</title>
<style>
:root{--bg:#0B1322;--surf:#131F36;--line:#25395E;--tx:#E7EDF8;--mut:#8FA2C4;--ok:#4FBF9B;--ko:#E0604B;--wa:#E3B23C;--ai:#5B8DEF}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--tx);
  font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:560px;margin:0 auto}
h1{font-size:20px;margin:6px 0 2px}
p.sub{color:var(--mut);font-size:13px;margin:0 0 16px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:0 0 10px}
.row{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border-bottom:0}
.row b{flex:1;font-weight:400;min-width:0;word-break:break-all}
.v{font-weight:700;white-space:nowrap}
.ok{color:var(--ok)}.ko{color:var(--ko)}.wa{color:var(--wa)}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px;margin-top:8px}
.ic{text-align:center;font-size:11px;color:var(--mut)}
.ic img{width:100%;aspect-ratio:1;object-fit:contain;background:#fff2;border-radius:10px;display:block;margin-bottom:4px}
.ic .bad{display:grid;place-items:center;aspect-ratio:1;border:1px dashed var(--ko);border-radius:10px;color:var(--ko);margin-bottom:4px}
pre{white-space:pre-wrap;word-break:break-all;font-size:11px;color:var(--mut);margin:8px 0 0}
a{color:var(--ai)}
</style>
</head>
<body>
<h1>Diagnostic d'installation</h1>
<p class="sub">Ouvrez cette page depuis le téléphone, sur l'adresse où l'application est hébergée.</p>

<div class="card"><h2>Verdict</h2><div id="verdict">Analyse en cours…</div>
<button id="inst" style="display:none;width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;
  background:var(--ai);color:#08111F;font:700 15px inherit">Installer l'application maintenant</button></div>
<div class="card"><h2>Conditions d'installation</h2><div id="cond"></div></div>
<div class="card"><h2>Icônes déclarées</h2><div id="icons">Chargement…</div></div>
<div class="card"><h2>Manifeste brut</h2><pre id="raw">Chargement…</pre></div>

<script>
const $=s=>document.querySelector(s);
function row(label,val,state){
  const d=document.createElement("div"); d.className="row";
  d.innerHTML='<b>'+label+'</b><span class="v '+(state||"")+'">'+val+'</span>';
  d.style.overflow="hidden";
  $("#cond").appendChild(d);
}
/* on enregistre le service worker ici aussi : sans lui, Chrome ne propose jamais l'installation */
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
/* suivi en direct : l'état du service worker met parfois plusieurs secondes à se stabiliser */
async function watchSW(){
  const el=document.getElementById("swline");
  for(let i=0;i<40;i++){
    let st="aucun";
    try{ const r=await navigator.serviceWorker.getRegistration();
      if(r) st = r.active?"actif":(r.installing?"en cours d'installation":(r.waiting?"en attente":"?"));
    }catch(e){ st="erreur"; }
    if(el){ el.textContent=st; el.className="v "+(st==="actif"?"ok":"wa"); }
    if(st==="actif") return;
    await new Promise(z=>setTimeout(z,1000));
  }
}
let PROMPT=null;
window.addEventListener("beforeinstallprompt",e=>{
  e.preventDefault(); PROMPT=e;
  const v=$("#verdict");
  v.innerHTML='<span class="ok" style="font-weight:700">Installable.</span> Chrome reconnaît une véritable application : '
    +"l'icône du manifeste sera utilisée. Installez depuis le bouton ci-dessous plutôt que par le menu.";
  const b=$("#inst"); b.style.display="block";
  b.onclick=async()=>{ b.disabled=true; PROMPT.prompt(); const r=await PROMPT.userChoice;
    b.textContent = r.outcome==="accepted" ? "Installation lancée" : "Installation refusée"; };
});
setTimeout(()=>{
  if(PROMPT) return;
  const v=$("#verdict");
  if(matchMedia("(display-mode: standalone)").matches){
    v.innerHTML='<span class="ok" style="font-weight:700">Déjà installée.</span> Cette page est ouverte depuis l\'application.';
  }else{
    v.innerHTML='<span class="ko" style="font-weight:700">Pas encore installable.</span> '
      +"Chrome n'a pas proposé l'installation dans les 15 premières secondes. Vérifiez la ligne "
      +"« Service worker » ci-dessous : tant qu'elle n'affiche pas <b>actif</b> en vert, l'installation "
      +"produira un simple raccourci avec une pastille grise. Patientez, puis rechargez la page.";
  }
},15000);

(async()=>{
  const https = location.protocol==="https:" || location.hostname==="localhost";
  row("Servi en HTTPS", https?"oui":"NON", https?"ok":"ko");

  const lk=document.querySelector('link[rel=manifest]');
  let manUrl=null, man=null, manStatus="absent";
  try{
    const probe=await fetch("manifest.webmanifest",{cache:"no-store"});
    manStatus=probe.status;
    if(probe.ok){ man=await probe.json(); manUrl=probe.url; }
  }catch(e){ manStatus="erreur réseau"; }
  row("Manifeste accessible", manStatus===200?"200 OK":String(manStatus), manStatus===200?"ok":"ko");
  if(man){
    row("Nom", man.name||"—", man.name?"ok":"ko");
    row("Mode d'affichage", man.display||"—", man.display==="standalone"?"ok":"wa");
    row("start_url", man.start_url||"—", man.start_url?"ok":"ko");
    const any=(man.icons||[]).filter(i=>(i.purpose||"any").includes("any")&&parseInt(i.sizes)>=192).length;
    const msk=(man.icons||[]).filter(i=>(i.purpose||"").includes("maskable")).length;
    row("Icônes ≥192 px (any)", any||"aucune", any?"ok":"ko");
    row("Icônes maskable", msk||"aucune", msk?"ok":"wa");
  }

  if(man&&man.start_url){
    const abs=new URL(man.start_url, manUrl||location.href).href;
    let st="?"; try{ const r=await fetch(abs,{cache:"no-store"}); st=r.status; }catch(e){ st="erreur"; }
    row("start_url atteignable", (st===200?"200 OK":String(st))+" — "+abs.replace(location.origin,""), st===200?"ok":"ko");
  }
  row("Titre de la page", document.title.slice(0,40), "");

  let sw="non pris en charge";
  if("serviceWorker" in navigator){
    try{
      let r=await navigator.serviceWorker.getRegistration();
      if(!r){ await new Promise(z=>setTimeout(z,2500)); r=await navigator.serviceWorker.getRegistration(); }
      sw = r ? (r.active?"actif":"en cours d'installation") : "aucun";
    }catch(e){ sw="erreur"; }
  }
  row("Service worker", '<span id="swline">'+sw+'</span>', sw==="actif"?"ok":"wa");
  watchSW();

  try{
    const rb=await fetch("robots.txt",{cache:"no-store"});
    const t=rb.ok?await rb.text():"";
    const blocked=/Disallow:\s*\/\s*$/m.test(t);
    row("robots.txt bloquant", blocked?"OUI — peut empêcher Chrome de récupérer les icônes":"non", blocked?"ko":"ok");
  }catch(e){ row("robots.txt","absent (sans conséquence)","ok"); }

  const inst = matchMedia("(display-mode: standalone)").matches || navigator.standalone===true;
  row("Lancée comme application", inst?"oui":"non (onglet)", inst?"ok":"wa");
  row("Navigateur", (navigator.userAgentData&&navigator.userAgentData.brands
      ? navigator.userAgentData.brands.map(b=>b.brand+" "+b.version).join(", ")
      : navigator.userAgent.slice(0,80)), "");

  // aperçu réel de chaque icône
  const box=$("#icons"); box.innerHTML="";
  if(!man||!man.icons){ box.textContent="Manifeste illisible."; }
  else{
    const g=document.createElement("div"); g.className="icons";
    for(const ic of man.icons){
      const d=document.createElement("div"); d.className="ic";
      let st=0;
      try{ const r=await fetch(ic.src,{cache:"no-store"}); st=r.status; }catch(e){ st="err"; }
      d.innerHTML = (st===200)
        ? '<img src="'+ic.src+'" alt=""><span>'+ic.sizes+'<br>'+(ic.purpose||"any")+'</span>'
        : '<div class="bad">'+st+'</div><span>'+ic.sizes+'<br>'+(ic.purpose||"any")+'</span>';
      g.appendChild(d);
    }
    box.appendChild(g);
    box.insertAdjacentHTML("beforeend",
      '<p style="font-size:12px;color:var(--mut);margin:10px 0 0">Si toutes les vignettes s\'affichent, le serveur fournit bien les icônes : le problème vient alors du cache de Chrome, et il faut effacer les données du site puis réinstaller.</p>');
  }
  $("#raw").textContent = man ? JSON.stringify(man,null,1) : "—";
})();
</script>
</body>
</html>
