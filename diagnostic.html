<!doctype html><html lang="fr"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>みち — diagnostic</title>
<style>body{font-family:system-ui,sans-serif;background:#0E1116;color:#EFEBE1;padding:20px;line-height:1.6}
h1{font-size:20px} .ok{color:#4FBE93} .ko{color:#E2593F} li{margin:4px 0}</style>
<h1>みち — diagnostic d'installation</h1>
<ul id="r"><li>Analyse en cours…</li></ul>
<script>
const r=document.getElementById('r');
const add=(ok,t)=>{r.insertAdjacentHTML('beforeend',
  `<li class="${ok?'ok':'ko'}">${ok?'✓':'✗'} ${t}</li>`);};
r.innerHTML='';
add(location.protocol==='https:'||location.hostname==='localhost','Servi en HTTPS');
add('serviceWorker' in navigator,'Service worker pris en charge');
add('speechSynthesis' in window,'Synthèse vocale disponible');
add(!!window.localStorage,'Stockage local accessible');
fetch('manifest.webmanifest').then(x=>x.json()).then(m=>{
  add(true,'Manifeste lu : '+m.name);
  return Promise.all(m.icons.map(i=>fetch(i.src,{method:'HEAD'})
    .then(x=>[i.src,x.ok]).catch(()=>[i.src,false])));
}).then(l=>{
  const ko=l.filter(x=>!x[1]);
  add(!ko.length, ko.length? ko.length+' icône(s) introuvable(s) : '+ko.map(x=>x[0]).join(', ')
                           : l.length+' icônes présentes');
}).catch(e=>add(false,'Manifeste illisible : '+e));
navigator.serviceWorker?.getRegistrations().then(l=>
  add(true, l.length? l.length+' service worker enregistré' : 'Aucun service worker actif (normal au premier chargement)'));
</script></html>
